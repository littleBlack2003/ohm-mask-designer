name: Deploy pure web designer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp "Ohm Mask Designer/index.html" _site/
          cp "Ohm Mask Designer/project-ui.js" _site/
          cp "Ohm Mask Designer/canvas-controls.js" _site/
          cp "Ohm Mask Designer/static-api.js" _site/
          cp "Ohm Mask Designer/pyodide.js" _site/
          cp "Ohm Mask Designer/i18n.js" _site/
          cp "Ohm Mask Designer/web_bridge.py" _site/
          cp "Ohm Mask Designer/loc.py" _site/
          cp "Ohm Mask Designer/manufacturing.py" _site/
          cp "Ohm Mask Designer/area_statistics.py" _site/
          cp "Ohm Mask Designer/default_project.json" _site/
          cp "ohm-mask-skill/scripts/make_mask.py" _site/
          cp LICENSE _site/LICENSE.txt
          cp NOTICE _site/NOTICE.txt
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
