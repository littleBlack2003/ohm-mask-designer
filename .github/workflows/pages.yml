name: Deploy pure web designer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp "图案开口设计器/index.html" _site/
          cp "图案开口设计器/project-ui.js" _site/
          cp "图案开口设计器/canvas-controls.js" _site/
          cp "图案开口设计器/static-api.js" _site/
          cp "图案开口设计器/pyodide.js" _site/
          cp "图案开口设计器/web_bridge.py" _site/
          cp "图案开口设计器/manufacturing.py" _site/
          cp "图案开口设计器/area_statistics.py" _site/
          cp "图案开口设计器/default_project.json" _site/
          cp "pvd-shadow-mask/scripts/make_mask.py" _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
